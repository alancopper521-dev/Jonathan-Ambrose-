<!DOCTYPE html>
<html>
<head>
    <title>Orientation Form</title>
</head>
<body>

<h2>Veritas University Orientation Form</h2>

<form>

<fieldset>
<legend>Student Info</legend>

<label>Full Name:</label><br>
<input type="text" name="name" placeholder="Full Name" required><br><br>

<label>Matric Number:</label><br>
<input type="text" name="matric" placeholder="VUG/SEN/25/13595" required><br><br>

<label>Email:</label><br>
<input type="email" name="email" placeholder="Email" required><br><br>

<label>Age:</label><br>
<input type="number" name="age" required><br><br>

<label>Date of Birth:</label><br>
<input type="date" name="dob" required><br><br>

</fieldset>

<fieldset>
<legend>Other Details</legend>

<label>Gender:</label><br>
<input type="radio" name="gender" value="male" required> Male
<input type="radio" name="gender" value="female"> Female<br><br>

<label>Faculty:</label><br>
<select name="faculty" required>
<option value="">Select</option>
<option>Science</option>
<option>Arts</option>
<option>Management</option>
<option>Education</option>
</select><br><br>

<label>Documents:</label><br>
<input type="checkbox"> Admission Letter
<input type="checkbox"> Birth Certificate
<input type="checkbox"> Result<br><br>

<label>Upload:</label><br>
<input type="file" required><br><br>

<label>Comments:</label><br>
<textarea rows="3" cols="25"></textarea><br><br>

</fieldset>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
